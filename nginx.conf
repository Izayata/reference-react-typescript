# Explicit CORS origin allowlist instead of a bare '*'.
# The SPA is served by this same nginx and calls the API via relative
# paths, so those requests are same-origin and need no CORS headers at
# all - this allowlist only matters for genuinely cross-origin callers
# (e.g. local dev on a different port). Add real deployed frontend
# origin(s) below; anything not listed gets no CORS header and is
# blocked by the browser, instead of being reflected via '*'.
map $http_origin $cors_allow_origin {
    default "";
    "~^https?://localhost(:[0-9]+)?$" $http_origin;
    # "https://your-production-frontend-domain.example" $http_origin;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Add Docker's internal DNS resolver
    resolver 127.0.0.11;

    # Handle React Router - serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API endpoints to backend
    location ~ ^/(auth-status|csrf-token|login|v1|actuator)(/.*)?$ {
        proxy_pass http://app:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_allow_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Add CORS headers for actual requests
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}