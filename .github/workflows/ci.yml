name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        # Runs with the default CI=true (react-scripts treats ESLint warnings as
        # build-breaking errors in that mode) now that src/main/** has zero
        # warnings — see AUDIT.md §5.1/§6. Any new warning introduced in
        # src/main/** will fail this step immediately rather than silently
        # accumulating; warnings confined to src/test/** don't affect it, since
        # CRA's build-time lint only covers files reachable from the app's
        # entry point.
        run: CI=true npm run build
